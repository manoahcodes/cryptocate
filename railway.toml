[build]
builder = "nixpacks"

[build.nixpacks]
aptPkgs = ["libpq-dev", "gcc", "python3-dev"]

[deploy]
startCommand = "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

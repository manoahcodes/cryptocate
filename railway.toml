[build]
builder = "nixpacks"

[build.nixpacks]
aptPkgs = ["libpq-dev", "gcc", "python3-dev"]

[deploy]
startCommand = gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 && celery -A backend worker --loglevel=info --concurrency=4 && celery -A backend beat --loglevel=info
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

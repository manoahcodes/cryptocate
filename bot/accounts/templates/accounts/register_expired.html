<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Expired — WhaleWatch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a12;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #12121e;
      border: 1px solid #1e1e36;
      border-radius: 16px;
      padding: 48px 36px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .emoji { font-size: 4rem; margin-bottom: 16px; display: block; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 12px; }
    p { font-size: 0.9rem; color: #94a3b8; line-height: 1.6; margin-bottom: 8px; }
    .mono {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.9em;
      color: #818cf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="emoji">⏰</span>
    <h1>Link Expired</h1>
    <p>This registration link has expired or already been used.</p>
    <p>Registration links are valid for <strong>1 hour</strong>.</p>
    <br>
    <p>
      Open <strong>WhaleWatch Bot</strong> in Telegram and run
      <span class="mono">/start</span> to get a fresh link.
    </p>
  </div>
</body>
</html>
